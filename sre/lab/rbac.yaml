# Read-only identity for the MCP server. Built-in `view` (no Secrets) + nodes, metrics, and our SLO CRD.
# Deliberately NOT granted: nodes/proxy (kubelet API ~ exec), secrets, any write verb.
apiVersion: v1
kind: Namespace
metadata: {name: sre-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sre-agent, namespace: sre-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sre-agent-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: sre-agent, namespace: sre-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sre-agent-extra-read}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [sre.demo.io]
    resources: [servicelevelobjectives]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sre-agent-extra-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sre-agent-extra-read}
subjects: [{kind: ServiceAccount, name: sre-agent, namespace: sre-system}]
